name: Deploy OpenXE Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Zum Produktiv-Deployment exakt "deploy-production" eingeben.'
        required: true
        type: string

concurrency:
  group: deploy-openxe-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy OpenXE to production server
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Validate production deployment gate
        env:
          CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Produktiv-Deployments sind nur vom master-Branch erlaubt. Aktueller Ref: ${GITHUB_REF}"
            exit 1
          fi

          if [ "${CONFIRM_PRODUCTION_DEPLOY}" != "deploy-production" ]; then
            echo 'Abbruch: Zum Produktiv-Deployment muss exakt "deploy-production" bestaetigt werden.'
            exit 1
          fi

      - name: Configure SSH
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_SSH_PRIVATE_KEY}"
          test -n "${PRODUCTION_SSH_KNOWN_HOSTS}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "${PRODUCTION_SSH_PRIVATE_KEY}" > ~/.ssh/openxe_production
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/openxe_production ~/.ssh/known_hosts

      - name: Deploy current master on production
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          PRODUCTION_HTTP_HOST: ${{ secrets.PRODUCTION_HTTP_HOST }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_SSH_HOST}"
          test -n "${PRODUCTION_SSH_USER}"
          test -n "${EXPECTED_SHA}"

          SSH_PORT="${PRODUCTION_SSH_PORT:-22}"
          DEPLOY_PATH="${PRODUCTION_DEPLOY_PATH:-/var/www/html/OpenXE}"

          ssh \
            -i ~/.ssh/openxe_production \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "EXPECTED_SHA=${EXPECTED_SHA} APP_DIR=${DEPLOY_PATH} HTTP_HOST=${PRODUCTION_HTTP_HOST:-}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="${APP_DIR:-/var/www/html/OpenXE}"
          EXPECTED_SHA="${EXPECTED_SHA:?EXPECTED_SHA fehlt}"
          PREVIOUS_REV=""
          UPGRADE_STARTED=0

          restore_previous_revision() {
            local status=$?
            trap - ERR

            if [ "$UPGRADE_STARTED" != "1" ] || [ -z "$PREVIOUS_REV" ]; then
              exit "$status"
            fi

            echo "Deployment fehlgeschlagen. Setze Code auf $PREVIOUS_REV zurueck."
            sudo -n chown -R "$USER:$USER" "$APP_DIR" || true
            git -C "$APP_DIR" reset --hard "$PREVIOUS_REV" || true
            sudo -n chown -R www-data:www-data "$APP_DIR" || true
            exit "$status"
          }

          test -d "$APP_DIR/.git"
          test -d "$APP_DIR/upgrade"
          test -f "$APP_DIR/upgrade/data/upgrade.php"

          PREVIOUS_REV="$(git -C "$APP_DIR" rev-parse HEAD)"
          echo "Aktueller Stand vor Deploy: $PREVIOUS_REV"

          trap restore_previous_revision ERR
          UPGRADE_STARTED=1

          sudo -n chown -R "$USER:$USER" "$APP_DIR"
          cd "$APP_DIR/upgrade"
          php data/upgrade.php -do -f
          sudo -n chown -R www-data:www-data "$APP_DIR"

          ACTUAL_SHA="$(git -C "$APP_DIR" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Unerwarteter Commit nach Deploy: erwartet $EXPECTED_SHA, aktuell $ACTUAL_SHA"
            exit 1
          fi

          verify_deploy_health() {
            local url="http://127.0.0.1/OpenXE/favicon.ico"

            if [ -n "${HTTP_HOST:-}" ]; then
              echo "HTTP-Healthcheck mit Host-Header: ${HTTP_HOST}"
              curl -fsS -o /dev/null -H "Host: ${HTTP_HOST}" "$url"
              return
            fi

            if curl -fsS -o /dev/null "$url" 2>/dev/null; then
              return
            fi

            echo "Lokaler HTTP-Check auf 127.0.0.1/OpenXE fehlgeschlagen (typisch ohne passenden VirtualHost)."
            echo "Pruefe Apache-Status und App-Dateien als Fallback."
            systemctl is-active --quiet apache2
            test -r "$APP_DIR/index.php"
            test -r "$APP_DIR/www/index.php"
          }

          verify_deploy_health

          trap - ERR
          echo "Produktiv-Deployment erfolgreich: $ACTUAL_SHA"
          echo "Hinweis: Datenbank-Aenderungen werden nicht automatisch zurueckgerollt."
          REMOTE
