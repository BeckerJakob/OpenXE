services:
  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
    image: openxe_frontend
    entrypoint: npm run dev
    volumes:
      - .:/app:delegated
    ports:
      - "5173:5173"
  app_init:
    image: openxe:test
    volumes:
      - .:/var/www/html:delegated
    working_dir: /var/www/html/upgrade
    entrypoint:
      - /bin/sh
      - -lc
      - |
        if [ -f /var/www/html/conf/user.inc.php ]; then
          php data/upgrade.php -db -do
        else
          echo "Skipping app_init: conf/user.inc.php not found. Run setup at http://localhost:8081 first."
        fi
    depends_on:
      mysql:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openxe:test
    volumes:
      - .:/var/www/html:delegated
    cpus: 2.0
    mem_limit: 1536m
    ports:
      - "8081:80"
    depends_on:
      app_init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
  mysql:
    image: mariadb:10.6
    command:
      - --innodb-page-size=32k
      - --innodb-buffer-pool-size=1024M
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
      - --skip-name-resolve
    cpus: 2.0
    mem_limit: 2048m
    environment:
      MYSQL_ROOT_PASSWORD: "rootpw"
      MYSQL_USER: "openxe"
      MYSQL_PASSWORD: "openxe"
      MYSQL_DATABASE: "openxe"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      interval: 5s
      retries: 3
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      timeout: 30s

volumes:
  mysqldata: {}